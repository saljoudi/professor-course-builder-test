<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Builder Settings</title><style>body{font-family:system-ui;background:#f5f6f8;color:#17212b;margin:0}.wrap{max-width:700px;margin:50px auto;padding:0 20px}.card{background:white;border:1px solid #e1e5e9;border-radius:18px;padding:24px;box-shadow:0 12px 35px rgba(16,24,40,.06)}h1{margin-top:0}label{display:block;font-weight:700;margin-top:18px}input{width:100%;padding:12px;border:1px solid #d9dee5;border-radius:10px;margin-top:6px;box-sizing:border-box}button{margin-top:16px;border:0;background:#263c72;color:white;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.secondary{background:white;color:#17212b;border:1px solid #d9dee5;margin-left:6px}.hint{color:#667085;font-size:13px}.status{margin-top:14px;padding:10px;border-radius:9px;background:#f3f5f7;font-size:13px}</style></head><body><div class="wrap"><div class="card"><h1>Course Builder settings</h1><p class="hint">During local development use <strong>http://localhost:8787</strong>. After you deploy the central API to Render, replace it with the API service URL. API keys never belong here.</p><label>Central API URL<input id="apiBase" type="url" placeholder="https://your-course-api.onrender.com"></label><button id="save">Save & test</button><button id="reset" class="secondary">Use localhost</button><div id="status" class="status">Not tested yet.</div></div></div><script src="options.js"></script></body></html>
